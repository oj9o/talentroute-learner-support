name: Final project verification
on:
  push:
    paths: ['final/**', '.github/workflows/final-container.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: final
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: extractions/setup-just@v3
      - run: just install
      - run: just pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: final-linux-aggregate-evidence
          path: |
            final/outputs/*.csv
            final/docs/final_report.md
